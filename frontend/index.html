<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Communication Prototype</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-layout">
        <section class="panel hero-panel">
          <div class="hero-copy">
            <p class="eyebrow">Communication Workspace</p>
          </div>

          <form id="settings-form" class="settings">
            <label>
              Your user
              <select id="user-id">
                <option value="user_a">User A</option>
                <option value="user_b">User B</option>
              </select>
            </label>

            <label>
              Session ID
              <input id="session-id" value="session-001" autocomplete="off" />
            </label>

            <button type="submit">Connect</button>
          </form>

          <div class="status-row">
            <span id="connection-status">Disconnected</span>
          </div>
        </section>

        <form id="delay-form" class="panel delay-card">
          <div class="delay-card-controls">
            <label>
            Delay (seconds)
            <input id="delay-seconds" type="number" min="0" max="600" step="1" value="0" />
            </label>
            <button type="submit" class="ghost-button">Apply Delay</button>
          </div>
          <span id="delay-status" class="delay-status">Current delay: 0s</span>
        </form>
      </section>

      <section class="workspace-layout">
        <section class="panel thread-panel" data-thread="user">
          <div class="thread-header">
            <div>
              <h2>User Chat</h2>
            </div>
            
          </div>

          <div id="user-messages" class="messages" aria-live="polite"></div>

          <div class="selection-bar">
            <span id="user-selection-status">No user messages selected</span>
          </div>

          <form id="message-form" class="composer">
            <label class="compact-label">
              Send to
              <select id="receiver-id">
                <option value="user_b">User B</option>
                <option value="user_a">User A</option>
              </select>
            </label>
            <textarea
              id="message-content"
              class="composer-textarea"
              placeholder="Type a message for the other user"
            ></textarea>
            <div class="composer-row composer-row-secondary">
              <button type="submit">Send to User</button>
              <div class="attachment-stack">
                <div class="attachment-row">
                  <label class="compact-label">
                    Attach files
                    <input id="message-attachments" name="attachments" type="file" multiple />
                  </label>
                  <button type="button" id="clear-message-attachments" class="ghost-button ghost-button-subtle">Remove</button>
                </div>
                <div id="message-attachments-status" class="attachment-status">No attachments selected</div>
              </div>
            </div>
          </form>
        </section>

        <section class="panel thread-panel" data-thread="llm">
          <div class="thread-header">
            <div>
              <h2>LLM Chat</h2>
            </div>
            <div class="thread-tools">
              <button type="button" id="reindex-button" class="ghost-button">Re-index Knowledge Base</button>
            </div>
          </div>

          <div id="llm-messages" class="messages" aria-live="polite"></div>

          <div class="llm-context-bar">
            <span id="llm-mode-chip" class="context-chip">Mode: global</span>
            <span id="llm-document-chip" class="context-chip context-chip-muted">No active document</span>
            <button type="button" id="clear-document-button" class="ghost-button ghost-button-subtle">Clear Document</button>
          </div>

          <div class="selection-bar">
            <span id="llm-selection-status">No LLM messages selected</span>
            <span id="llm-status" class="llm-status"></span>
          </div>

          <form id="llm-form" class="composer composer-llm">
            <textarea
              id="llm-content"
              class="composer-textarea"
              placeholder="Type a message for the LLM"
            ></textarea>
            <div class="composer-row composer-row-secondary">
              <button type="submit" id="ask-llm-button" class="secondary-button">Send to LLM</button>
              <div class="attachment-stack">
                <div class="attachment-row">
                  <label class="compact-label">
                    Attach files
                    <input id="llm-attachments" name="llm_attachments" type="file" multiple />
                  </label>
                  <button type="button" id="clear-llm-attachments" class="ghost-button ghost-button-subtle">Remove</button>
                </div>
                <div id="llm-attachments-status" class="attachment-status">No attachments selected</div>
              </div>
            </div>
          </form>
        </section>
      </section>
    </main>

    <div id="message-menu-backdrop" class="context-menu-backdrop" hidden></div>
    <div id="message-menu" class="context-menu" hidden>
      <button type="button" data-action="send-user">Send to User Chat</button>
      <button type="button" data-action="send-llm">Send to LLM Chat</button>
      <button type="button" data-action="clear-selection">Clear Selection</button>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
