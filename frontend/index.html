<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Communication Prototype</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <h1>Communication Prototype</h1>

        <form id="settings-form" class="settings">
          <label>
            Your user
            <select id="user-id">
              <option value="user_a">User A</option>
              <option value="user_b">User B</option>
            </select>
          </label>

          <label>
            Session ID
            <input id="session-id" value="session-001" autocomplete="off" />
          </label>

          <button type="submit">Connect</button>
        </form>

        <div class="status-row">
          <span id="connection-status">Disconnected</span>
          <span id="condition-label">Condition: unknown</span>
        </div>
      </section>

      <section class="chat-layout">
        <section class="panel chat-panel">
          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="message-form" class="composer">
            <label>
              Send to
              <select id="receiver-id">
                <option value="user_b">User B</option>
                <option value="user_a">User A</option>
              </select>
            </label>
            <input id="message-content" placeholder="Type a message" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </section>

        <aside class="panel llm-panel">
          <div class="llm-panel-header">
            <h2>LLM Drafting</h2>
            <p>Ask the local model for a suggested reply, then choose whether to forward it.</p>
          </div>

          <label>
            Prompt for LLM
            <textarea
              id="llm-prompt"
              class="llm-textarea"
              placeholder="Ask the local model for a suggested message"
            ></textarea>
          </label>

          <div class="llm-actions">
            <button type="button" id="ask-llm-button" class="secondary-button">Ask LLM</button>
            <button type="button" id="send-llm-button" disabled>Send Last Message to User</button>
          </div>

          <label>
            Latest LLM response
            <textarea
              id="llm-response"
              class="llm-textarea llm-response"
              readonly
              placeholder="The latest LLM response will appear here"
            ></textarea>
          </label>

          <div id="llm-status" class="llm-status" aria-live="polite"></div>
        </aside>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
